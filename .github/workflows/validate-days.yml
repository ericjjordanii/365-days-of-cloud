name: Validate Day Packages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Day folders
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          day_dirs=(Day[0-9][0-9][0-9]-*)

          if [ ${#day_dirs[@]} -eq 0 ]; then
            echo "No Day folders found yet. Nothing to validate."
            exit 0
          fi

          declare -A seen_days

          for dir in "${day_dirs[@]}"; do
            echo "Validating $dir"

            if [ ! -f "$dir/README.md" ]; then
              echo "ERROR: $dir is missing README.md"
              exit 1
            fi

            if [ ! -f "$dir/day.yaml" ]; then
              echo "ERROR: $dir is missing day.yaml"
              exit 1
            fi

            folder_day="${dir:3:3}"
            yaml_day=$(grep -E '^day:[[:space:]]*[0-9]+' "$dir/day.yaml" | head -1 | sed -E 's/day:[[:space:]]*//')

            if [ -z "$yaml_day" ]; then
              echo "ERROR: $dir/day.yaml is missing a numeric day field"
              exit 1
            fi

            printf -v yaml_day_padded '%03d' "$yaml_day"
            if [ "$folder_day" != "$yaml_day_padded" ]; then
              echo "ERROR: Folder Day $folder_day does not match day.yaml value $yaml_day"
              exit 1
            fi

            if [ -n "${seen_days[$yaml_day_padded]:-}" ]; then
              echo "ERROR: Duplicate Day number $yaml_day_padded found in $dir and ${seen_days[$yaml_day_padded]}"
              exit 1
            fi
            seen_days[$yaml_day_padded]="$dir"

            required_keys=(title season category difficulty xp status skills certification_alignment azure_cost social github published)
            for key in "${required_keys[@]}"; do
              if ! grep -Eq "^${key}:" "$dir/day.yaml"; then
                echo "ERROR: $dir/day.yaml is missing required key: $key"
                exit 1
              fi
            done

            if ! grep -Eq '^# Day [0-9]{3} - ' "$dir/README.md"; then
              echo "ERROR: $dir/README.md must begin with '# Day XXX - Topic'"
              exit 1
            fi
          done

          echo "All Day packages passed validation."
